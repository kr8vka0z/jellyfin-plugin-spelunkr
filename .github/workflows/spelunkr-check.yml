# spelunkr-check.yml: once a day, check that spelunkr.tv still works the way this plugin expects (data shape,
# engine version, and what is actually playing on every channel). On failure, open or update an issue labelled
# broken-by-spelunkr with the details. Run it by hand with simulate_break to prove the issue path works.
# GitHub starts a timer only from main's copy of this file, so that copy checks main and dev in turn.
name: Spelunkr check

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      simulate_break:
        description: Force a failure to test the issue path
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  branches:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        # dev may not exist. Checking it blindly would report a missing branch as a Spelunkr break.
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/dev" >/dev/null; then
            echo 'list=["main","dev"]' >> "$GITHUB_OUTPUT"
          else
            echo 'list=["main"]' >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # one at a time, so two failures share one issue
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install the headless browser
        working-directory: tools/check
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Check
        env:
          SIMULATE: ${{ inputs.simulate_break && '--simulate-break' || '' }}
        run: bun tools/check/check.ts --report report.md $SIMULATE

      - name: Open or update the broken-by-spelunkr issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.branch }}
        run: |
          [ -f report.md ] || echo "The check crashed before writing a report." > report.md
          printf '\n\nBranch: %s\nRun: %s/%s/actions/runs/%s\n' "$BRANCH" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> report.md
          open=$(gh issue list --label broken-by-spelunkr --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file report.md
          else
            gh issue create --title "Spelunkr check failed" --label broken-by-spelunkr --body-file report.md
          fi
