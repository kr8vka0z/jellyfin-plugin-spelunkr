# release.yml: on a version tag (v0.1.0), build the plugin zip, publish it as a GitHub release, and add the
# version to manifest.json on main. That file is the plugin repository URL users add to Jellyfin.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TARGET_ABI: "12.3.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Work out the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          # Jellyfin versions have four parts; tags have three.
          case "$v" in *.*.*.*) ;; *) v="$v.0" ;; esac
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "ZIP=jellyfin-plugin-spelunkr_$v.zip" >> "$GITHUB_ENV"

      - name: Test and build
        run: |
          dotnet test -c Release
          dotnet publish Jellyfin.Plugin.Spelunkr -c Release -p:Version="$VERSION" -o out

      - name: Package
        run: |
          mkdir pkg
          cp out/Jellyfin.Plugin.Spelunkr.dll out/Jint.dll out/Acornima.dll pkg/
          # meta.json lets a manually unzipped copy load with the right name and version.
          jq --arg v "$VERSION" --arg abi "$TARGET_ABI" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.[0] | {guid, name, description, overview, owner, category, version: $v, targetAbi: $abi, timestamp: $ts, changelog: "", status: "Active", autoUpdate: true, assemblies: []}' \
            manifest.json > pkg/meta.json
          # Python's zipfile, not `zip`: on the runner `zip` exited 0 without writing the file (v0.1.0 run).
          python3 -m zipfile -c "$ZIP" pkg/*
          # No pipe, so bash -e stops here if md5sum fails (the step runs without pipefail).
          md5=$(md5sum "$ZIP")
          md5="${md5%% *}"
          echo "MD5=$md5" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "$ZIP" --title "$TAG" --generate-notes

      - name: Add the version to manifest.json on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --depth 1 origin main
          git checkout -B main origin/main
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          jq --arg v "$VERSION" --arg abi "$TARGET_ABI" --arg url "$url" --arg md5 "$MD5" \
             --arg log "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
             --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '.[0].versions = [{version: $v, changelog: $log, targetAbi: $abi, sourceUrl: $url, checksum: $md5, timestamp: $ts}] + .[0].versions' \
             manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $VERSION"
          git push origin main
