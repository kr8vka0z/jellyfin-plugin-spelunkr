# build-plugin: test the plugin and package it as the zip Jellyfin installs. Shared by release.yml and
# test-build.yml so a test build is packaged exactly like a release. Callers set up bun first.
name: Build plugin
description: Test, build and zip the plugin at a given four-part version

inputs:
  version:
    description: Four-part Jellyfin version, for example 0.3.4.0
    required: true

outputs:
  zip:
    description: Name of the zip
    value: ${{ steps.package.outputs.zip }}
  md5:
    description: MD5 checksum of the zip
    value: ${{ steps.package.outputs.md5 }}
  target-abi:
    description: The Jellyfin version the zip targets
    value: ${{ steps.package.outputs.target-abi }}

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    # Some tests run the real ffmpeg.
    - name: Install ffmpeg
      shell: bash
      run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

    - name: Test and build
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        dotnet test -c Release
        dotnet publish Jellyfin.Plugin.Spelunkr -c Release -p:Version="$VERSION" -o out

    - name: Package
      id: package
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        # Everything the zip ships. Jellyfin's own assemblies aren't published (ExcludeAssets="runtime").
        DLLS: Jellyfin.Plugin.Spelunkr.dll Jint.dll Acornima.dll
      run: |
        # A dependency a package upgrade adds would pass every test (they run from the build output) and then
        # fail to load in Jellyfin, so the published DLLs must be exactly the ones shipped.
        read -ra shipped <<<"$DLLS"
        extra=""
        for f in out/*.dll; do
          [[ " $DLLS " == *" ${f#out/} "* ]] || extra+=" ${f#out/}"
        done
        if [ -n "$extra" ]; then
          echo "::error::Published but not packaged:$extra. Add it to DLLS here and to the install steps in README.md."
          exit 1
        fi
        TARGET_ABI=$(bun tools/release/feed.ts target-abi)
        ZIP="jellyfin-plugin-spelunkr_$VERSION.zip"
        mkdir pkg
        (cd out && cp -- "${shipped[@]}" ../pkg/)
        # meta.json lets a manually unzipped copy load with the right name and version.
        jq --arg v "$VERSION" --arg abi "$TARGET_ABI" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '.[0] | {guid, name, description, overview, owner, category, version: $v, targetAbi: $abi, timestamp: $ts, changelog: "", status: "Active", autoUpdate: true, assemblies: []}' \
          manifest.json > pkg/meta.json
        # Python's zipfile, not `zip`: on the runner `zip` exited 0 without writing the file (v0.1.0 run).
        python3 -m zipfile -c "$ZIP" pkg/*
        md5=$(md5sum "$ZIP" | cut -d' ' -f1)
        {
          echo "zip=$ZIP"
          echo "md5=$md5"
          echo "target-abi=$TARGET_ABI"
        } >> "$GITHUB_OUTPUT"
