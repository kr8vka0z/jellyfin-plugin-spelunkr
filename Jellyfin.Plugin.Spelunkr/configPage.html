<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Spelunkr</title>
</head>
<body>
    <div id="SpelunkrConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="SpelunkrConfigForm">
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="ShowCabinet" type="checkbox" is="emby-checkbox" />
                            <span>Show the TV cabinet</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription">
                            Plays every channel inside a wood-grain TV. Applies the next time a channel is opened with nobody watching it.
                        </div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var pluginId = '5f0d6b2e-7c1a-4b9e-9a43-3e2b8d4c1a07';
                document.querySelector('#SpelunkrConfigPage').addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        document.querySelector('#ShowCabinet').checked = config.ShowCabinet;
                        Dashboard.hideLoadingMsg();
                    });
                });
                document.querySelector('#SpelunkrConfigForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        config.ShowCabinet = document.querySelector('#ShowCabinet').checked;
                        ApiClient.updatePluginConfiguration(pluginId, config).then(Dashboard.processPluginConfigurationUpdateResult);
                    });
                    return false;
                });
            })();
        </script>
    </div>
</body>
</html>
